<!DOCTYPE html>

    html { scroll-behavior: smooth; }
    body { background: linear-gradient(180deg, #0f0f1b, #1a1a2e); font-family: 'Poppins', sans-serif; }
    .neon-text { color: #a78bfa; text-shadow: 0 0 5px #a78bfa, 0 0 10px #7c3aed; }
    .neon-btn:hover { box-shadow: 0 0 10px #22d3ee, 0 0 20px #38bdf8; }
    .hidden { display: none !important; }
    .error { color: #f87171; }

</head>

      <nav id="main-nav" class="hidden md:flex space-x-6">

        <a href="kepek.html" class="hover:text-blue-400">Képek</a>

  </header>

  <!-- Password Gate -->
  <section class="min-h-screen flex flex-col justify-center items-center text-center px-6">
    <div id="password-box" class="mt-24 max-w-md w-full bg-[#181826] rounded-lg shadow-lg p-8 border border-purple-500">
      <h2 class="text-3xl font-bold neon-text mb-4">Titkos oldal 🔒</h2>
      <p class="mb-4 text-gray-300">Add meg a jelszót a belépéshez!</p>
      <input id="password-input" type="password" placeholder="Jelszó..." class="w-full px-4 py-2 rounded bg-[#22223a] text-white border border-blue-400 focus:outline-none mb-4" autocomplete="off" />
      <button id="password-btn" class="w-full px-4 py-2 bg-blue-500 text-white font-semibold rounded neon-btn transition">Belépés</button>
      <p id="error-msg" class="mt-4 error hidden"></p>
    </div>

<div id="secret-content" class="hidden mt-12 max-w-2xl w-full bg-[#181826] rounded-lg shadow-xl p-8 border border-purple-700">

  <p class="text-gray-300 mb-6">Ez az oldal csak azoknak elérhető, akik tudják a jelszót...</p>

      <video controls class="w-full rounded shadow-md border border-blue-400 bg-black">

  <!-- Picture Frames -->
  <div>
    <h3 class="text-2xl font-semibold neon-text mb-4">Képek</h3>
    <div class="grid grid-cols-2 gap-4">
      <img src="https://images.guns.lol/acYHk.jpg" onclick="showModal(this.src)">
      <img src="https://images.guns.lol/8xf2t.jpg" onclick="showModal(this.src)">
      <img src="https://images.unsplash.com/photo-1519125323398-675f0ddb6308?auto=format&fit=facearea&w=400&h=300" alt="Kép 3" class="rounded shadow-md border-2 border-purple-400 cursor-pointer transition-transform transform hover:scale-105" onclick="showModal(this.src)">
      <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=facearea&w=400&h=300" alt="Kép 4" class="rounded shadow-md border-2 border-purple-400 cursor-pointer transition-transform transform hover:scale-105" onclick="showModal(this.src)">
    </div>
  </div>

  <!-- Image Modal -->
  <div id="imgModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden">
    <span onclick="hideModal()" class="absolute top-4 right-8 text-3xl cursor-pointer text-white font-bold">&times;</span>
    <img id="modalImg" src="" class="max-h-[80vh] max-w-[90vw] rounded-lg shadow-2xl border-4 border-purple-500" alt="Nagy kép">
  </div>

  <!-- Return to Home Button -->
  <div class="mt-8 flex justify-center">
    <a href="index.html" class="px-6 py-3 bg-blue-500 text-white font-semibold rounded neon-btn transition hover:bg-blue-600">Vissza a főoldalra</a>
  </div>
</div>
  </section>

  <!-- Footer -->
  <footer class="py-6 text-center bg-black text-gray-400 text-sm">
    © 2025 Pedroツ. All rights reserved.
  </footer>

  <script>
    // Navbar mobile toggle
    document.getElementById('menu-toggle').onclick = function() {
      var menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    };

    ScrollReveal().reveal('[data-sr]', {
      delay: 100,
      distance: '40px',
      duration: 800,
      easing: 'ease-out',
      origin: 'bottom',
      interval: 200,
    });

    // Password logic
    const PASSWORD = "PedroOnTopXD"; // <-- change this to your class password!
    const passwordBox = document.getElementById('password-box');
    const secretContent = document.getElementById('secret-content');
    const passwordInput = document.getElementById('password-input');
    const passwordBtn = document.getElementById('password-btn');
    const errorMsg = document.getElementById('error-msg');

    function checkPassword() {
      if (passwordInput.value === PASSWORD) {
        passwordBox.classList.add('hidden');
        secretContent.classList.remove('hidden');
      } else {
        errorMsg.textContent = "Hibás jelszó! Próbáld újra.";
        errorMsg.classList.remove('hidden');
        passwordInput.value = "";
        passwordInput.focus();
      }
    }

    passwordBtn.addEventListener('click', checkPassword);
    passwordInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
	  // Modal for images
  function showModal(src) {
    document.getElementById('modalImg').src = src;
    document.getElementById('imgModal').classList.remove('hidden');
  }
  function hideModal() {
    document.getElementById('imgModal').classList.add('hidden');
    document.getElementById('modalImg').src = "";
  }
  </script>
</body>
</html>
